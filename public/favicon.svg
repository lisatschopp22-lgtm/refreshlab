<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Matches the default lockup: the instrument mark on the botanical
       palette. A favicon cannot read CSS tokens, so the colour is literal
       here and changes when the brand colour is decided. -->
  <rect width="32" height="32" rx="7" fill="#2f6b4f"/>
  <g transform="translate(4 4)" fill="none" stroke="#ffffff" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.1" y="6.2" width="19.8" height="13.6" rx="2.6"/>
    <rect x="5" y="9.1" width="8.4" height="5.6" rx="1.1"/>
    <circle cx="18" cy="11.9" r="1.9"/>
    <path d="M5 17.6h8.4"/>
  </g>
</svg>
